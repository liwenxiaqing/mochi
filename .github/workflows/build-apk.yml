name: Build Offline APK
 on:
   push:
     branches: [ main ]
   workflow_dispatch:
 jobs:
   build-apk:
     runs-on: ubuntu-latest
     steps:
       - name: 拉取你的网页源码
         uses: actions/checkout@v4
       - name: 配置JDK17
         uses: actions/setup-java@v4
         with:
           java-version: '17'
           distribution: 'temurin'
       - name: 拉取WebView安卓模板
         run: git clone --depth=1 https://github.com/zygote62/WebViewApkTemplate.git android-template
       - name: 复制网页资源
         run: |
           mkdir -p android-template/app/src/main/assets
           cp -r ./* android-template/app/src/main/assets/ || true
       - name: 编译Debug APK
         working-directory: android-template
         run: ./gradlew assembleDebug
       - name: 上传APK成品
         uses: actions/upload-artifact@v4
         with:
           name: 进制二传演字卡APK
           path: android-template/app/build/outputs/apk/debug/app-debug.apk
